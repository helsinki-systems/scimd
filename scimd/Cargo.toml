[package]
name = "scimd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-web = { version = "4.9.0", default-features = false, features = [
  "macros",
] }
async-trait = "0.1.81"
futures-util = "0.3.30"

env_logger = "0.11"
log = "0.4"

serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
uuid = { version = "1.8.0", features = ["serde"] }
