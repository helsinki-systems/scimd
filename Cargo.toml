[workspace]
resolver = "2"
# Remember the alphabet is a thing
members = [
  "example",
  "gitlabd",
  "scimd",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.91.0"

[workspace.dependencies]
actix-web = { version = "4.6.0", default-features = false, features = ["macros"] }
actix-web-prom = { version = "0.10.0", default-features = false }
anyhow = "1"
async-trait = "0.1.81"
clap = "4.5.6"
dotenvy = "0.15.7"
fs-err = "3.0"
futures-util = "0.3.30"
gitlab = "0.1902.0"
http = "^1"
nom = "8"
prometheus = { version = "0.14", default-features = false } # Pinned to what actix-web-prom depends on
sd-notify = "0.5.0"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.0.0"
tracing = "0.1.40"
tracing-actix-web = "0.7.19"
tracing-log = "0.2"
tracing-subscriber = "0.3.18"
uuid = "1.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
