[graph]
all-features = true
exclude-dev = true

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [ ]

[licenses]
allow = [
  "0BSD",             # https://tldrlegal.com/license/bsd-0-clause-license
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",       # https://tldrlegal.com/license/apache-license-2.0-(apache-2.0)
  "BSD-3-Clause",     # https://tldrlegal.com/license/bsd-3-clause-license-(revised)
  "CDLA-Permissive-2.0",
  "ISC",              # https://tldrlegal.com/license/-isc-license
  "MIT",              # https://tldrlegal.com/license/mit-license
  "Unicode-3.0",      # https://spdx.org/licenses/Unicode-3.0.html
  "Unlicense",        # https://tldrlegal.com/license/unlicense
  "Zlib",             # https://www.tldrlegal.com/license/zlib-libpng-license-zlib
]
confidence-threshold = 0.8
exceptions = [ ]
clarify = [
  { name = "ring", expression = "MIT AND ISC AND OpenSSL", license-files = [ { path = "LICENSE", hash = 0xbd0eed23 } ] }
]

[licenses.private]
ignore = true
registries = [ ]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [ ]
deny = [ ]

skip = [ ]
skip-tree = [ ]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
