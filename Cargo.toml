[workspace]
resolver = "2"
# Remember the alphabet is a thing
members = [
  "example",
  "scimd",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.91.0"

[workspace.dependencies]
actix-web = { version = "4.6.0", default-features = false, features = ["macros"] }
anyhow = "1"
async-trait = "0.1.81"
clap = "4.5.6"
dotenvy = "0.15.7"
futures-util = "0.3.30"
sd-notify = "0.4.1"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.40"
tracing-actix-web = "0.7.19"
tracing-log = "0.2"
tracing-subscriber = "0.3.18"
uuid = "1.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
